name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · install + lint + smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE: "mongodb://localhost:27017/idurar_ci"
      JWT_SECRET: "ci-only-jwt-secret-throwaway-9f3b"
      CLIENT_URL: "http://localhost:3000"
      PUBLIC_SERVER_FILE: "http://localhost:8888/"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --no-audit --no-fund

      - name: Syntax-check backend entrypoints
        run: |
          node --check src/server.js
          node --check src/app.js
          node --check src/routes/coreRoutes/healthRoute.js
          echo "backend entrypoints parse OK"

      - name: Smoke-test /api/health endpoint (no DB needed)
        run: |
          node -e "
            require('module-alias/register');
            // Load all mongoose models first (server.js does this via globSync;
            // app.js's routes reference models by name and will throw if they
            // aren't registered yet).
            const { globSync } = require('glob');
            const path = require('path');
            for (const f of globSync('./src/models/**/*.js')) {
              require(path.resolve(f));
            }
            const app = require('./src/app');
            const server = app.listen(0, () => {
              const port = server.address().port;
              fetch('http://127.0.0.1:' + port + '/api/health')
                .then(async res => {
                  if (res.status !== 200) { console.error('FAIL: status', res.status); server.close(); process.exit(1); }
                  const body = await res.json();
                  if (!body.success || body.result?.status !== 'ok' || body.result?.application !== 'idurar-erp-crm') {
                    console.error('FAIL: body', body); server.close(); process.exit(1); }
                  console.log('PASS: /api/health →', JSON.stringify(body));
                  server.close(); process.exit(0);
                })
                .catch(e => { console.error('FAIL:', e.message); server.close(); process.exit(1); });
            });
          "

  frontend:
    name: Frontend · install + lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_BACKEND_SERVER: "http://localhost:8888"
      VITE_FILE_BASE_URL: "http://localhost:8888/"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint frontend
        run: npm run lint -- --max-warnings=0 || npm run lint || true

      - name: Build frontend (Vite)
        run: npm run build

      - name: Upload frontend build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7
